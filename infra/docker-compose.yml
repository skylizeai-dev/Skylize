# Local Skylize backend core. `docker compose up` brings up the backing services
# and the gateway (postgres backend). Run from the repo root:
#   docker compose -f infra/docker-compose.yml up --build
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skylize
      POSTGRES_USER: skylize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skylize"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Guardrail policy engine (OPA). Serves the decision policy bundle (../policy)
  # over HTTP on :8181; the Decision Engine / OPAClient evaluate every action
  # against it. FAIL-CLOSED SKELETON: the bundle currently denies everything
  # until real per-class policy content is authored (see ../policy and
  # docs/04_decision_engine/guardrails.md). Pinned to a specific release so
  # policy evaluation is reproducible. No Docker healthcheck: the official OPA
  # image is distroless (no shell/curl), so a CMD/CMD-SHELL probe cannot run
  # inside it — liveness is the HTTP GET /health endpoint on :8181.
  opa:
    image: openpolicyagent/opa:1.18.2
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    ports: ["8181:8181"]
    volumes:
      - ../policy:/policies:ro

  # Runs migrations as the ADMIN/superuser role. Migration 0003 creates the
  # non-superuser `skylize_app` role the gateway then connects as.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      SKYLIZE_DB_URL: postgresql://skylize:${POSTGRES_PASSWORD:-localdev}@postgres:5432/skylize
      # Password for the app role created by migration 0003.
      SKYLIZE_APP_DB_PASSWORD: ${SKYLIZE_APP_DB_PASSWORD:-appdev}
    depends_on:
      postgres: { condition: service_healthy }

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      SKYLIZE_BACKEND: postgres
      # Admin DSN is present for completeness, but the RUNTIME uses the app DSN
      # below (non-superuser, RLS-subject).
      SKYLIZE_DB_URL: postgresql://skylize:${POSTGRES_PASSWORD:-localdev}@postgres:5432/skylize
      SKYLIZE_DB_APP_URL: postgresql://skylize_app:${SKYLIZE_APP_DB_PASSWORD:-appdev}@postgres:5432/skylize
      SKYLIZE_REDIS_URL: redis://redis:6379
      # Guardrail policy engine. In-cluster DNS name of the opa service above.
      SKYLIZE_OPA_URL: http://opa:8181
      # MUST be false here. SKYLIZE_BACKEND is postgres above, and dev auth trusts
      # the X-Dev-Org / X-Dev-User / X-Dev-Roles headers verbatim
      # (src/skylize/edge/auth.py:39-50) — on a real backend that is not
      # authentication, it is an open door to every tenant in the database.
      # Settings REFUSES to construct on that combination
      # (config.py _forbid_dev_auth_on_a_real_backend), so flipping this back to
      # "true" does not loosen the stack, it stops the gateway from starting.
      # Authenticate against this stack the way a deployment does: POST
      # /api/v1/auth/register then /api/v1/auth/login, and send the access JWT.
      SKYLIZE_DEV_AUTH: "false"
      # Required once dev auth is off (config.py _require_jwt_secret_when_prod).
      # Local-only default, same convention as the DB passwords above; override
      # via the environment for anything reachable off this machine.
      SKYLIZE_JWT_SECRET: ${SKYLIZE_JWT_SECRET:-localdev-jwt-secret-change-me}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      # OPA has no healthcheck (distroless image), so gate on start, not health.
      opa: { condition: service_started }

  # OPA Decision Engine worker — a SEPARATE PROCESS from the gateway, not a
  # second engine inside it. Per environment exactly one engine emits terminal
  # `decision.*` events (docs/04_decision_engine/decision_engine.md §2), and
  # SKYLIZE_DECISION_ENGINE is the interlock: `bootstrap` refuses to build the
  # inline engine when it reads "opa" (src/skylize/bootstrap.py:251), and this
  # worker refuses to start unless it does
  # (src/skylize/decision_engine/worker.py:78-83). Both sides fail closed, so
  # the two can never double-decide a proposal.
  #
  # INERT BY DEFAULT, and deliberately by `profiles:` rather than by the
  # interlock. `docker compose up` does not start a profiled service at all, so
  # nothing is scheduled, nothing restart-loops, and no log noise is produced
  # while the flag is "inline". Relying on the interlock instead would start a
  # container that crashes on boot every time — inert in effect, alarming in
  # appearance, and indistinguishable from a real outage. To run it once the
  # flag flips:
  #   docker compose -f infra/docker-compose.yml --profile opa-engine up
  #
  # NOT READY TO ENABLE. The policy bundle at ../policy is still a fail-closed
  # placeholder that denies everything (see the `opa` service above), so this
  # worker would correctly reject every proposal it consumed. This entry exists
  # so the deployment shape is reviewable and version-controlled, not because
  # the engine is ready.
  decision-engine-worker:
    profiles: ["opa-engine"]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["python", "-m", "skylize.decision_engine.worker"]
    environment:
      # The interlock. The worker raises RuntimeError on anything but "opa".
      SKYLIZE_DECISION_ENGINE: opa
      # Tenants this worker consumes for. `DecisionEngineConsumer.run` raises on
      # an empty list rather than idling silently (consumer.py:160-163), so this
      # must name real orgs. JSON-array form, parsed by Settings (config.py:113).
      SKYLIZE_DECISION_ENGINE_ORG_IDS: ${SKYLIZE_DECISION_ENGINE_ORG_IDS:-["org_local"]}
      # NOTE the variable name: DecisionEngineSettings reads SKYLIZE_DATABASE_URL
      # (decision_engine/config.py:30), NOT the SKYLIZE_DB_URL / SKYLIZE_DB_APP_URL
      # pair the gateway uses (config.py:36-37). They are different settings
      # classes and the names do not overlap — supplying only SKYLIZE_DB_URL here
      # would fail pydantic validation at startup, since database_url has no
      # default. Connects as the RLS-subject app role, like the gateway runtime.
      SKYLIZE_DATABASE_URL: postgresql://skylize_app:${SKYLIZE_APP_DB_PASSWORD:-appdev}@postgres:5432/skylize
      SKYLIZE_REDIS_URL: redis://redis:6379
      SKYLIZE_OPA_URL: http://opa:8181
      # Required, no defaults (decision_engine/config.py:26-27) — the worker will
      # not start until these are supplied in the environment or a .env file.
      # Names only here; never commit values.
      SKYLIZE_LANGFUSE_PUBLIC_KEY: ${SKYLIZE_LANGFUSE_PUBLIC_KEY}
      SKYLIZE_LANGFUSE_SECRET_KEY: ${SKYLIZE_LANGFUSE_SECRET_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      # OPA has no healthcheck (distroless image), so gate on start, not health.
      opa: { condition: service_started }

volumes:
  postgres_data:
  redis_data:
