[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skylize"
version = "0.1.0"
description = "Skylize multi-agent platform"
requires-python = ">=3.12"

# Sprint 1 foundation + Sprint 2 backend core.
# LLM providers (anthropic, openai), LangGraph orchestration, vector store
# (qdrant-client), observability (opentelemetry, langfuse) and object storage
# (aioboto3) are added in the sprints that first import them.
dependencies = [
    # Crypto — CB-1 RESOLVED: governance tokens are ECDSA P-384 (see ecc_service.py)
    "cryptography>=42.0",

    # Validation & settings — the contract language across the whole spine
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",

    # Edge / API gateway
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",   # OIDC JWT verification

    # System of record
    "asyncpg>=0.29",
    "alembic>=1.13",
    "sqlalchemy>=2.0",          # Alembic plumbing only; runtime queries use raw asyncpg

    # Event bus + cache + queue
    "redis[hiredis]>=5.0",

    # Agent orchestration control plane.
    # NOTE: langgraph transitively pulls langchain-core / langsmith / langchain-protocol.
    # Those transitive packages are ACCEPTED and load-bearing — LangGraph structurally
    # requires langchain-core at every published version. The "no LangChain/CrewAI" rule
    # bans only DIRECT src/ imports of langchain/langchain_*/langsmith/crewai; it is NOT
    # a constraint on the dependency tree. Enforced in CI by
    # scripts/check_forbidden_imports.py (AST scan of src/, never `pip list`).
    "langgraph>=0.2",

    # Structured logging
    "structlog>=24.1",

    # Time-sortable IDs for partition keys
    "python-ulid>=2.2",

    # Context compression proxy (Model Context Engine, T-D). tiktoken cl100k_base
    # is the ground-truth tokenizer for budget accounting; markdownify does the
    # L1 HTML→Markdown prune. The MiniLM embedder (sentence-transformers) is NOT
    # added here — it lands with the Sprint-2 memory embedding service.
    "tiktoken>=0.7.0",
    "markdownify>=0.13.0",

    # Knowledge ingestion pipeline (Sprint-2 memory work)
    "qdrant-client>=1.9",
    "openai>=1.0",

    # LLM provider — Anthropic Claude (creative crew + agent execution).
    "anthropic>=0.39",

    # Durable workflow execution (Temporal Cloud). activities.py imports
    # `temporalio` at module load, so it is required for test collection.
    "temporalio>=1.7",

    # Resilience — @retry on the HubSpot + web-search built-in tools.
    "tenacity>=8.2",

    # Human user auth — bcrypt password hashing; email-validator backs the
    # pydantic EmailStr fields on the auth request models (import-time check).
    "bcrypt>=4.1",
    "email-validator>=2.1",

    # Async file IO for the credential vault / deliverable staging.
    "aiofiles>=23.2",

    # Deliverable exporters + memory extraction: DOCX (python-docx), Markdown,
    # XLSX (openpyxl), Markdown→HTML→PDF (xhtml2pdf, pure-Python), and PDF
    # text extraction (pypdf — memory/extraction.py imports it at call time).
    "python-docx>=1.1",
    "markdown>=3.6",
    "openpyxl>=3.1",
    "xhtml2pdf>=0.2.16",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark",
    "import-linter>=2.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",   # httpx mocking for the edge/CORS + adapter tests
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests live under tests/ only. Keeping src/ out of testpaths prevents a stray
# test_*.py inside the package from breaking collection for the whole suite
# (the Sprint-1 CI failure: a bare `import ecc_service` in src aborted pytest).
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: requires real Postgres/Redis (SKYLIZE_TEST_DB_URL / SKYLIZE_TEST_REDIS_URL); skipped otherwise",
]

# ----------------------------------------------------------------------------
# Boundary enforcement (repository_structure.md §4): agents/ may import only
# schemas/.  The import-linter contract gate fails the build on any violation.
# ----------------------------------------------------------------------------
[tool.importlinter]
root_package = "skylize"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Agents may only import schemas"
type = "forbidden"
source_modules = ["skylize.agents"]
forbidden_modules = [
    "skylize.adapters",
    "skylize.dal",
    "skylize.app",
    "skylize.runtime",
    "skylize.events",
    "skylize.memory",
]

[[tool.importlinter.contracts]]
name = "Schemas are leaf packages"
type = "forbidden"
source_modules = ["skylize.schemas"]
forbidden_modules = [
    "skylize.adapters",
    "skylize.dal",
    "skylize.app",
    "skylize.events",
    "skylize.memory",
    "skylize.contracts",
]

# SQL/driver lives only in dal/ (and the composition root that wires concretes).
# The genuinely pure inner layers must never reach a database driver; the
# Application Boundary depends on dal *ports*, not on asyncpg. `bootstrap` (the
# composition root) and `edge` (the process entrypoint) are allowed to construct
# concrete adapters at startup.
[[tool.importlinter.contracts]]
name = "Pure inner layers hold no database driver"
type = "forbidden"
source_modules = [
    "skylize.agents",
    "skylize.schemas",
    "skylize.contracts",
    "skylize.runtime",
    "skylize.memory",
]
forbidden_modules = ["asyncpg"]

[[tool.importlinter.contracts]]
name = "Application logic contains no SQL (depends on dal ports only)"
type = "forbidden"
source_modules = ["skylize.app"]
forbidden_modules = ["skylize.dal.repositories", "skylize.dal.connection", "asyncpg"]

# CrewAI and LangChain are forbidden as direct dependencies of this codebase.
# langgraph (the mandated orchestration layer) transitively carries langchain_core
# (and, through it, langsmith / langchain_protocol) — that pull-in is accepted as
# the cost of the mandated stack. This contract only blocks *our* code from
# importing the LangChain/CrewAI ecosystem directly; because grimp treats external
# packages as leaf nodes (root_package = "skylize"), it never sees langgraph's own
# internal langchain_core import, so the accepted transitive dependency does not trip it.
#
# import-linter can only ENUMERATE forbidden packages (no prefix matching), so this
# list names the members of the langchain_* family we expect to encounter. The
# authoritative, prefix-based gate for the whole `langchain_*` family plus langsmith
# is scripts/check_forbidden_imports.py (AST scan), wired into the same CI job.
[[tool.importlinter.contracts]]
name = "No direct LangChain/CrewAI imports (langgraph's transitive langchain_core is accepted)"
type = "forbidden"
source_modules = ["skylize"]
forbidden_modules = [
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_openai",
    "langchain_anthropic",
    "langsmith",
    "crewai",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Third-party libraries that ship no type information (no py.typed / stubs).
# We keep `strict` for our own code; these get import-level leniency only.
[[tool.mypy.overrides]]
module = [
    "asyncpg.*", "redis.*", "jose.*", "langgraph.*", "qdrant_client.*", "openai.*",
    "markdown.*", "xhtml2pdf.*", "openpyxl.*", "temporalio.*", "mem0.*",
]
ignore_missing_imports = true

# Subsystems that are NOT wired into bootstrap (dead/paused code slated for the
# post-launch M5 excision/rework — see the launch plan). Typing errors here
# must not gate CI for the live product; remove each line when the subsystem
# is excised or brought back to life.
[[tool.mypy.overrides]]
module = [
    "skylize.decision_engine.*",
    "skylize.app.decision_engine.*",
    "skylize.app.orchestrator.temporal.*",
    "skylize.services.obsidian_writer.*",
    "skylize.memory.adapters.*",
]
ignore_errors = true
