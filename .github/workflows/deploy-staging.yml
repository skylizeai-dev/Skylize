name: Deploy → Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: skylize-api
  ECS_CLUSTER: skylize-staging
  ECS_SERVICE: skylize-staging-api
  CONTAINER_NAME: api

jobs:
  # ── Gate: lint + type-check + unit tests ────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # GATE PARITY WITH ci.yml's `unit` JOB. This job used to run five of the
      # eight gates CI runs, which made the deploy pipeline a WEAKER gate than
      # the one guarding a pull request: code could fail CI's architecture
      # checks and still be built, pushed to ECR and deployed to staging.
      # Keep this list identical to ci.yml's `unit` job, in the same order.
      - name: Ruff lint
        run: ruff check src tests

      - name: Import boundaries
        run: lint-imports

      # ADDED 2026-07-31 -- the three gates this job was missing.
      # ADR-0002: LangGraph OSS is the sole orchestration framework. This is
      # the authoritative prefix-based AST scan over src/; the import-linter
      # contract above can only enumerate named packages.
      - name: Forbidden imports (no direct LangChain/CrewAI in src)
        run: python scripts/check_forbidden_imports.py

      - name: All modules importable (catches broken imports lint-imports can't see)
        run: python scripts/check_all_modules_importable.py

      - name: Orphan-module contract (no NEW unreachable modules vs allowlist)
        run: python scripts/find_orphan_modules.py

      - name: Type check
        run: mypy src

      # Was `pytest -q --tb=short -m "not integration"`. Now bare `pytest -q`,
      # matching ci.yml exactly. This job configures no services and sets no
      # SKYLIZE_TEST_* variables, so the integration tests self-skip here
      # exactly as they do in CI's unit job -- the marker filter was hiding
      # that they were being deselected rather than skipped, and any test
      # carrying no marker but needing no services was silently outside both
      # invocations' intersection. The integration suite still runs for real in
      # the integration-test job below, against live Postgres and Redis.
      - name: Unit tests (no exclusions)
        run: pytest -q

  # ── Integration tests (real Postgres + Redis) ────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skylize
          POSTGRES_USER: skylize
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd "pg_isready -U skylize"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      # Admin DSN (superuser) — migrations only.
      SKYLIZE_TEST_DB_URL: postgresql://skylize:testpass@localhost:5432/skylize
      # App DSN — the non-superuser, RLS-subject role the isolation tests use to
      # prove tenant isolation actually holds. This MUST NOT be the superuser DSN
      # above: a superuser bypasses every RLS policy even with FORCE ROW LEVEL
      # SECURITY, so pointing both at the same role makes every tenant-isolation
      # test either meaningless or outright failing (it was the latter: 25 failed).
      # The password must match SKYLIZE_APP_DB_PASSWORD below, which is what
      # migration 0003 creates the role with.
      SKYLIZE_TEST_APP_DB_URL: postgresql://skylize_app:testpass@localhost:5432/skylize
      SKYLIZE_APP_DB_PASSWORD: testpass
      SKYLIZE_TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations (admin role; migration 0003 creates skylize_app)
        run: alembic upgrade head
        env:
          SKYLIZE_DB_URL: postgresql://skylize:testpass@localhost:5432/skylize
          # Migration 0003 reads this to set the skylize_app password; with it
          # unset the role is created LOGIN with NO password (0003 lines 49-50)
          # and the app DSN above cannot authenticate. Job-level env already
          # supplies it, so this is explicit belt-and-braces matching ci.yml.
          SKYLIZE_APP_DB_PASSWORD: testpass

      - name: Integration tests
        run: pytest -q -m integration -rA

  # ── Build + push Docker image to ECR ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: integration-test
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # SHA-ONLY TAGS (owner decision, 2026-07-31). This job used to also tag
      # and push :latest. It sits behind `needs: integration-test`, which now
      # passes, so `docker push :latest` ran and succeeded while the `deploy`
      # job that follows still failed -- publishing a container that cannot
      # boot under the tag every human and the terraform task definition
      # (modules/ecs, ecr_image_uri) treat as "the current staging image".
      #
      # RESTORE :latest ONLY AFTER a deploy job has completed green end to end,
      # i.e. the ECS service reached steady state and the /health smoke test
      # returned 200. At that point :latest means "an image that booted"; until
      # then it means "the newest image, boot status unknown", which is worse
      # than no tag. The deploy job below consumes the SHA tag directly via
      # needs.build-and-push.outputs.image, so nothing here depends on :latest.
      #
      # -f Dockerfile is explicit rather than relying on the context default:
      # this repo had two gateway Dockerfiles until 2026-07-31 and the whole
      # class of bug was that nobody could tell which one CI built.
      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ── Deploy to ECS (rolling) ──────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_CLUSTER-api \
            --query taskDefinition \
            > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names skylize-staging-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "ALB: $ALB_DNS"
          # Retry for up to 60s to account for TG health check warm-up
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting 10s..."
            sleep 10
          done
          echo "Smoke test failed after retries"
          exit 1
